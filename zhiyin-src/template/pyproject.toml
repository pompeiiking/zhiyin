[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhiyin"
version = "0.1.0"
description = "职引 · 第一期工程（模块化单体：api / business / orchestration / data-sdk / infrastructure / boot）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

# 运行依赖：HTTP Client 是 PAMI 生产适配器的基础依赖；其余中间件驱动按
# M3 部署形态放在可选依赖组，默认的本地模式仍保持轻量。
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27,<1",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "redis>=5.0",
]

[project.optional-dependencies]
mysql = [
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncmy>=0.2.9,<1",
    "cryptography>=42,<47",
    "pymysql>=1.1,<2",
    "alembic>=1.13,<2",
]
vector = [
    "asyncpg>=0.29,<1",
    "pgvector>=0.3,<1",
]
pami-infra = [
    "aiokafka>=0.11,<1",
    "elasticsearch[async]>=8.12,<9",
    "minio>=7.2,<8",
]
m3 = [
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncmy>=0.2.9,<1",
    "cryptography>=42,<47",
    "pymysql>=1.1,<2",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "pgvector>=0.3,<1",
    "aiokafka>=0.11,<1",
    "elasticsearch[async]>=8.12,<9",
    "minio>=7.2,<8",
]
dev = [
    "aiosqlite>=0.20,<1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
zhiyin = "zhiyin_boot.__main__:main"

# ---------------------------------------------------------------------------
# 六个代码包分布在六个目录下（目录名用连字符、包名用下划线），
# 这里显式列出，保证 `pip install -e .` 后六层都可 import。
# 新增子包时记得同步这里的 packages 列表。
# ---------------------------------------------------------------------------
[tool.setuptools]
packages = [
    "zhiyin_kernel",
    "zhiyin_api",
    "zhiyin_api.controllers",
    "zhiyin_api.dto",
    "zhiyin_api.facade",
    "zhiyin_business",
    "zhiyin_business.contracts",
    "zhiyin_business.ports",
    "zhiyin_business.policies",
    "zhiyin_business.services",
    "zhiyin_business.workers",
    "zhiyin_orchestration",
    "zhiyin_orchestration.impl",
    "zhiyin_data_sdk",
    "zhiyin_data_sdk.gateways",
    "zhiyin_data_sdk.repositories",
    "zhiyin_infrastructure",
    "zhiyin_infrastructure.crawl",
    "zhiyin_infrastructure.kafka",
    "zhiyin_infrastructure.llm",
    "zhiyin_infrastructure.local",
    "zhiyin_infrastructure.minio",
    "zhiyin_infrastructure.mysql",
    "zhiyin_infrastructure.pami",
    "zhiyin_infrastructure.persistence",
    "zhiyin_infrastructure.pgvector",
    "zhiyin_infrastructure.redis",
    "zhiyin_infrastructure.workers",
    "zhiyin_boot",
    "zhiyin_boot.container",
]

[tool.setuptools.package-dir]
zhiyin_kernel = "zhiyin-kernel/zhiyin_kernel"
zhiyin_api = "zhiyin-api/zhiyin_api"
zhiyin_business = "zhiyin-business/zhiyin_business"
zhiyin_orchestration = "zhiyin-orchestration/zhiyin_orchestration"
zhiyin_data_sdk = "zhiyin-data-sdk/zhiyin_data_sdk"
zhiyin_infrastructure = "zhiyin-infrastructure/zhiyin_infrastructure"
zhiyin_boot = "zhiyin-boot/zhiyin_boot"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# 里程碑标记：e2e = 五环节主路径（tests/e2e/），M2 门禁的自动落点。
markers = [
    "e2e: 五环节端到端主路径（tests/e2e/，M2 退出条件）",
    "integration: 需要显式外部测试实例的集成验证（默认跳过）",
    # 第一期未闭合项的标记用例：断言目标行为、当前 xfail(strict)，
    # 修好后会变 XPASS 强制删除标记。清单见 docs/数据全链路/职引-第一期未闭合项与Mock标注清单.md。
    "phase1_open: 第一期未闭合项标记（实现完成后删除对应用例与 xfail）",
]
# 让 pytest 不装包也能直接跑（pytest>=7 的 pythonpath 选项）。
pythonpath = [
    "zhiyin-kernel",
    "zhiyin-api",
    "zhiyin-business",
    "zhiyin-orchestration",
    "zhiyin-data-sdk",
    "zhiyin-infrastructure",
    "zhiyin-boot",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 只开启「真问题」类别：E/W 语法与错误、F 未使用/未定义、B 常见缺陷。
# 刻意不开 I（isort 顺序）与 UP（pyupgrade）：`.contracts/` 下的契约文件先于
# 本次工程化底座冻结，开启后会产生 30+ 文件的大量纯风格改动。团队要统一风格时，
# 一次性执行 `ruff check --fix` 再把 I、UP 加进来即可。
select = ["E", "F", "B"]
ignore = [
    "E501", # 行长由 formatter 处理，中文注释超长不视为错误
    "B008", # FastAPI 的 Depends()/Body() 默认值调用是框架惯用法
]

[tool.ruff.lint.per-file-ignores]
# 测试里用 assert 与长字符串是正常的
"tests/*" = ["B011"]
