name: zhiyin-pami-frozen

services:
  mysql:
    ports: !reset []
  zhiyin-mysql-init:
    image: ${WANWU_MYSQL_IMAGE}
    restart: "no"
    networks:
      - wanwu-net
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${WANWU_MYSQL_PASSWORD}
      ZHIYIN_MYSQL_USER: ${ZHIYIN_MYSQL_USER}
      ZHIYIN_MYSQL_PASSWORD: ${ZHIYIN_MYSQL_PASSWORD}
    entrypoint: ["sh", "-ec"]
    command:
      - >-
        mysql -h mysql -u root -e
        "CREATE DATABASE IF NOT EXISTS zhiyin_service CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
        CREATE USER IF NOT EXISTS '$$ZHIYIN_MYSQL_USER'@'%' IDENTIFIED BY '$$ZHIYIN_MYSQL_PASSWORD';
        ALTER USER '$$ZHIYIN_MYSQL_USER'@'%' IDENTIFIED BY '$$ZHIYIN_MYSQL_PASSWORD';
        GRANT ALL PRIVILEGES ON zhiyin_service.* TO '$$ZHIYIN_MYSQL_USER'@'%';
        FLUSH PRIVILEGES;"
  redis:
    ports: !reset []
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${WANWU_REDIS_PASSWORD}", "ping"]
  minio:
    ports: !reset []
  kafka:
    ports: !reset []
    environment:
      KAFKA_CFG_ADVERTISED_LISTENERS: BROKER://${WANWU_KAFKA_HOST}:9092,CONTROLLER://${WANWU_KAFKA_HOST}:9093
  es:
    ports: !reset []
  bff-service:
    ports: !reset []
    build:
      context: .
      dockerfile: Dockerfile.bff
      args:
        WANWU_ARCH: ${WANWU_ARCH}
    image: zhiyin/pami-bff:dev
  agentscope:
    ports: !reset []
  rag:
    ports: !reset []
  agent:
    ports: !reset []
  nginx:
    ports: !override
      - "127.0.0.1:8081:8081"

  pgvector:
    build:
      context: ../../zhiyin-src/template/deploy/postgres
      dockerfile: Dockerfile
    image: zhiyin/pgvector:pg16
    restart: unless-stopped
    networks:
      - wanwu-net
    environment:
      POSTGRES_DB: ${ZHIYIN_PGVECTOR_DB}
      POSTGRES_USER: ${ZHIYIN_PGVECTOR_USER}
      POSTGRES_PASSWORD: ${ZHIYIN_PGVECTOR_PASSWORD}
    volumes:
      - zhiyin_pgvector_data:/var/lib/postgresql/data
      - zhiyin_pgvector_wal:/var/lib/postgresql/wal_archive
      - ../../zhiyin-src/template/deploy/postgres/init.sql:/docker-entrypoint-initdb.d/10-zhiyin-vector.sql:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  zhiyin-api:
    build:
      context: ../../zhiyin-src/template
      dockerfile: Dockerfile
    image: zhiyin/backend:dev
    restart: unless-stopped
    env_file:
      - ../../zhiyin-src/template/deploy/.env
    environment:
      ZHIYIN_ENV: local
      ZHIYIN_USE_MYSQL: "1"
      ZHIYIN_USE_PGVECTOR: "1"
      ZHIYIN_USE_MINIO: "1"
      ZHIYIN_PAMI_BASE_URL: http://nginx:8081
      ZHIYIN_DATABASE_URL: mysql+pymysql://${ZHIYIN_MYSQL_USER}:${ZHIYIN_MYSQL_PASSWORD}@mysql:3306/zhiyin_service?charset=utf8mb4
      ZHIYIN_VECTOR_DATABASE_URL: postgresql://${ZHIYIN_PGVECTOR_USER}:${ZHIYIN_PGVECTOR_PASSWORD}@pgvector:5432/${ZHIYIN_PGVECTOR_DB}
      ZHIYIN_REDIS_URL: redis://redis:6379
      ZHIYIN_REDIS_PASSWORD: ${WANWU_REDIS_PASSWORD}
      ZHIYIN_MINIO_ENDPOINT: minio:9000
      ZHIYIN_MINIO_ACCESS_KEY: ${WANWU_MINIO_USER}
      ZHIYIN_MINIO_SECRET_KEY: ${WANWU_MINIO_PASSWORD}
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - wanwu-net
    depends_on:
      nginx:
        condition: service_healthy
      zhiyin-mysql-init:
        condition: service_completed_successfully
      zhiyin-migrate:
        condition: service_completed_successfully
      pgvector:
        condition: service_healthy

  zhiyin-migrate:
    build:
      context: ../../zhiyin-src/template
      dockerfile: Dockerfile
    image: zhiyin/backend:dev
    restart: "no"
    env_file:
      - ../../zhiyin-src/template/deploy/.env
    environment:
      ZHIYIN_DATABASE_URL: mysql+pymysql://${ZHIYIN_MYSQL_USER}:${ZHIYIN_MYSQL_PASSWORD}@mysql:3306/zhiyin_service?charset=utf8mb4
    command: ["alembic", "upgrade", "head"]
    networks:
      - wanwu-net
    depends_on:
      zhiyin-mysql-init:
        condition: service_completed_successfully

  # 平台 rerank 协议转换桥（D7 ③）。
  #
  # 为什么存在：平台模型供应商只会 `POST <endpointUrl>/rerank`，而平台可用的两家
  # 上游（DashScope 兼容模式、Ark）都**没有**这个路径（实测 404），而平台的 RAG
  # 问答又强制要求 rerank 模型非空。于是本服务把该协议翻译成上游原生 rerank。
  #
  # 复用同一个后端镜像、不加公开端口、只在 wanwu-net 内可达；真实上游 Key 只从
  # gitignored 的 .env 注入（平台侧注册模型时只填占位 Key）。
  zhiyin-rerank-bridge:
    build:
      context: ../../zhiyin-src/template
      dockerfile: Dockerfile
    image: zhiyin/backend:dev
    restart: unless-stopped
    env_file:
      - ../../zhiyin-src/template/deploy/.env
    command: ["python", "-m", "zhiyin_boot", "rerank-bridge"]
    expose:
      - "8100"
    networks:
      - wanwu-net

  zhiyin-runtime-verify:
    profiles: ["verify"]
    build:
      context: ../../zhiyin-src/template
      dockerfile: Dockerfile
    image: zhiyin/backend:dev
    restart: "no"
    env_file:
      - ../../zhiyin-src/template/deploy/.env
    environment:
      ZHIYIN_DATABASE_URL: mysql+pymysql://${ZHIYIN_MYSQL_USER}:${ZHIYIN_MYSQL_PASSWORD}@mysql:3306/zhiyin_service?charset=utf8mb4
      ZHIYIN_VECTOR_DATABASE_URL: postgresql://${ZHIYIN_PGVECTOR_USER}:${ZHIYIN_PGVECTOR_PASSWORD}@pgvector:5432/${ZHIYIN_PGVECTOR_DB}
      ZHIYIN_REDIS_URL: redis://redis:6379
      ZHIYIN_REDIS_PASSWORD: ${WANWU_REDIS_PASSWORD}
      ZHIYIN_MINIO_ENDPOINT: minio:9000
      ZHIYIN_MINIO_ACCESS_KEY: ${WANWU_MINIO_USER}
      ZHIYIN_MINIO_SECRET_KEY: ${WANWU_MINIO_PASSWORD}
    command: ["python", "scripts/verify_m3_runtime.py"]
    networks: [wanwu-net]
    depends_on:
      zhiyin-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      pgvector:
        condition: service_healthy

  zhiyin-mysql-contract-verify:
    profiles: ["verify"]
    build:
      context: ../../zhiyin-src/template
      dockerfile: Dockerfile.contracts
    image: zhiyin/contracts:dev
    restart: "no"
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${WANWU_MYSQL_PASSWORD}
      ZHIYIN_MYSQL_USER: ${ZHIYIN_MYSQL_USER}
      ZHIYIN_MYSQL_PASSWORD: ${ZHIYIN_MYSQL_PASSWORD}
    command: ["python", "scripts/run_mysql_contracts.py"]
    networks: [wanwu-net]
    depends_on:
      zhiyin-migrate:
        condition: service_completed_successfully

  zhiyin-mysql-backup:
    profiles: ["ops"]
    image: ${WANWU_MYSQL_IMAGE}
    restart: "no"
    networks: [wanwu-net]
    environment:
      MYSQL_PWD: ${ZHIYIN_MYSQL_PASSWORD}
      MYSQL_HOST: mysql
      MYSQL_USER: ${ZHIYIN_MYSQL_USER}
      MYSQL_DATABASE: zhiyin_service
    volumes:
      - zhiyin_backups:/backups
      - ../../zhiyin-src/template/deploy/backup/mysql-backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    depends_on:
      zhiyin-migrate:
        condition: service_completed_successfully

  zhiyin-pgvector-backup:
    profiles: ["ops"]
    image: zhiyin/pgvector:pg16
    restart: "no"
    networks: [wanwu-net]
    environment:
      PGPASSWORD: ${ZHIYIN_PGVECTOR_PASSWORD}
      PGHOST: pgvector
      PGUSER: ${ZHIYIN_PGVECTOR_USER}
      PGDATABASE: ${ZHIYIN_PGVECTOR_DB}
    volumes:
      - zhiyin_backups:/backups
      - ../../zhiyin-src/template/deploy/backup/pgvector-backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    depends_on:
      pgvector:
        condition: service_healthy

  zhiyin-mysql-restore-verify:
    profiles: ["verify"]
    image: ${WANWU_MYSQL_IMAGE}
    restart: "no"
    networks: [wanwu-net]
    environment:
      MYSQL_PWD: ${WANWU_MYSQL_PASSWORD}
      MYSQL_HOST: mysql
    volumes:
      - zhiyin_backups:/backups
      - ../../zhiyin-src/template/deploy/backup/mysql-restore-verify.sh:/usr/local/bin/verify.sh:ro
    entrypoint: ["sh", "/usr/local/bin/verify.sh"]
    depends_on:
      mysql:
        condition: service_healthy

  zhiyin-pgvector-restore-verify:
    profiles: ["verify"]
    image: zhiyin/pgvector:pg16
    restart: "no"
    networks: [wanwu-net]
    environment:
      PGPASSWORD: ${ZHIYIN_PGVECTOR_PASSWORD}
      PGHOST: pgvector
      PGUSER: ${ZHIYIN_PGVECTOR_USER}
    volumes:
      - zhiyin_backups:/backups
      - ../../zhiyin-src/template/deploy/backup/pgvector-restore-verify.sh:/usr/local/bin/verify.sh:ro
    entrypoint: ["sh", "/usr/local/bin/verify.sh"]
    depends_on:
      pgvector:
        condition: service_healthy

volumes:
  zhiyin_pgvector_data:
  zhiyin_pgvector_wal:
  zhiyin_backups:
