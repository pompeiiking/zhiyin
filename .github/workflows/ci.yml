name: CI

# 架构约束不靠 review 记忆：越层 / 漏装配 / 契约漂移 / 断链在提交时就该失败。
# 本地同样的三条命令见 README「五分钟上手」。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: 后端（守卫 + 契约 + 门禁）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhiyin-src/template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装
        run: pip install -e ".[dev]"
      - name: 测试（AST 依赖守卫 + Port 契约测试 + 单元测试）
        run: python -m pytest -q
      - name: 静态检查
        run: python -m ruff check .
      - name: 接口契约快照与代码一致（contracts/openapi.json）
        run: python scripts/export_openapi.py --check
      - name: 里程碑门禁 M1（框架可验证，本期退出条件）
        run: python -m zhiyin_boot --check --phase=1
      - name: Wanwu 源码快照与部署资产边界
        run: python -m pytest tests/test_wanwu_vendor.py tests/test_container_assets.py tests/test_deploy_assets.py -q
      - name: 构建职引后端镜像
        run: docker build --tag zhiyin/backend:ci .
      - name: 容器内里程碑门禁
        run: docker run --rm zhiyin/backend:ci python -m zhiyin_boot --check --phase=1

  frontend:
    name: 前端（类型检查）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhiyin-src/template/zhiyin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        # package-lock.json 已入库，用 npm ci 保证 CI 装到的版本与本地一致。
        run: npm ci --no-audit --no-fund
      - name: 类型检查
        run: npm run typecheck
      - name: 前端类型与后端接口契约一致（types.ts == 契约快照的生成物）
        # 由 ../contracts/openapi.json 重新生成 src/api/types.ts 并比对：有 diff 说明
        # 后端改了字段而前端类型没跟上，或有人手改了生成物。
        # 快照本身与后端代码的一致性由后端作业的 pytest 守卫（tests/test_api_contract.py）。
        # 注意：本步断言的是"仓库里已提交的生成物与快照一致"，因此在本地未提交时会必然红，
        # 它的执行场合是 CI（干净工作区）。
        run: npm run check:api

  deployment:
    name: 统一部署配置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 生成一次性本地环境
        run: python deploy/init_env.py
      - name: 校验 Compose 模型
        run: docker compose --project-directory . --env-file deploy/.env -f platform/wanwu/docker-compose.yaml -f deploy/compose.yaml config --quiet
