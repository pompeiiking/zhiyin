server:
  host: bff-service
  port: 6668
  external_ip: localhost
  external_port: 6668
  web_base_url: http://localhost:8081
  api_base_url: http://localhost:6668
  # 本地补丁（2026-09-19，经用户授权）：原值为 http://172.17.0.1:6668（Docker 宿主网关），
  # 但本工程部署在 compose 网络内，RAG 取 embedding 时连不上该地址（Connection refused），
  # 导致知识库文档解析全部失败（know_doc_parsing_service_error）。同文件其余服务引用
  # （iam/app/model/mcp/rag/assistant/knowledge/workflow）一律用 compose 服务名，
  # 这里改回服务名与之一致。上游同步时注意保留本行改动（见 UPSTREAM.md）。
  callback_url: http://bff-service:6668

log:
  std: true
  level: debug
  logs:
    - enable: true
      filename: log/bff-info.log
      level: info
      max_size: 10
      max_backups: 10
      max_age: 30
    - enable: true
      filename: log/bff-err.log
      level: error
      max_size: 10
      max_backups: 10
      max_age: 30

jwt:
  signing-key: "zhYZAr7Q7JstuEXQBx5p2MdUtfsC7CY5"

decrypt-passwd:
  iv: "sdf4ddfsFD86Vdf2"
  key: "f5Su3GhNMM1rndyp"

i18n:
  type: jsonl
  xlsxPath: configs/microservice/bff-service/configs/wanwu-i18n.xlsx
  xlsxSheets:
    - bff-service
    - bff-custom
    - iam-service
    - model-service
    - knowledge-service
    - mcp-service
    - rag-service
    - assistant-service
    - app-service
  jsonlPath: configs/microservice/bff-service/configs/wanwu-i18n.jsonl
  langs:
    - code: zh
      name: 中文
    - code: en
      name: English
  defaultLang: zh

custom-info:
  version: v0.0.1
  login:
    background_path: "/v1/static/logo/login_bg.png"
    login_button_color: "#384BF7"
    welcome_text: bff_custom_login_welcome_text
  home:
    logo_path: "/v1/static/logo/title_logo.svg"
    title: bff_custom_home_title
  tab:
    tab_title: bff_custom_tab_title
    tab_logo_path: "/v1/static/logo/tab_logo.png"

doc-center:
  doc_path: configs/microservice/bff-service/static/docs/wanwu-openapi.pdf

